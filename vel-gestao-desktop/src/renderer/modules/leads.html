<div class="module-header">
    <div class="module-title">
        <h1><i class="fas fa-user-plus"></i> Gestão de Leads</h1>
        <p>Capture, qualifique e converta seus leads em clientes</p>
    </div>
    <div class="module-actions">
        <button class="btn btn-primary" id="addLeadBtn">
            <i class="fas fa-plus"></i> Novo Lead
        </button>
    </div>
</div>

<div class="module-stats">
    <div class="stat-card">
        <div class="stat-icon">
            <i class="fas fa-user-plus"></i>
        </div>
        <div class="stat-info">
            <h3 id="totalLeadsCount">0</h3>
            <p>Total de Leads</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon info">
            <i class="fas fa-star"></i>
        </div>
        <div class="stat-info">
            <h3 id="newLeadsCount">0</h3>
            <p>Novos Leads</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon warning">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="stat-info">
            <h3 id="qualifiedLeadsCount">0</h3>
            <p>Qualificados</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon success">
            <i class="fas fa-user-check"></i>
        </div>
        <div class="stat-info">
            <h3 id="convertedLeadsCount">0</h3>
            <p>Convertidos</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon primary">
            <i class="fas fa-percentage"></i>
        </div>
        <div class="stat-info">
            <h3 id="conversionRate">0%</h3>
            <p>Taxa de Conversão</p>
        </div>
    </div>
</div>

<div class="module-filters">
    <div class="filter-group">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="leadsSearch" placeholder="Buscar por nome, email, telefone ou empresa...">
        </div>
    </div>
    <div class="filter-group">
        <select id="leadsStatusFilter">
            <option value="all">Todos os Status</option>
            <option value="new">Novo</option>
            <option value="contacted">Contatado</option>
            <option value="qualified">Qualificado</option>
            <option value="proposal">Proposta</option>
            <option value="negotiation">Negociação</option>
            <option value="converted">Convertido</option>
            <option value="lost">Perdido</option>
        </select>
    </div>
    <div class="filter-group">
        <select id="leadsSourceFilter">
            <option value="all">Todas as Origens</option>
            <option value="website">Website</option>
            <option value="social_media">Redes Sociais</option>
            <option value="email_marketing">Email Marketing</option>
            <option value="referral">Indicação</option>
            <option value="cold_call">Cold Call</option>
            <option value="event">Evento</option>
            <option value="advertisement">Anúncio</option>
            <option value="other">Outros</option>
        </select>
    </div>
    <div class="filter-group">
        <select id="leadsPriorityFilter">
            <option value="all">Todas as Prioridades</option>
            <option value="low">Baixa</option>
            <option value="medium">Média</option>
            <option value="high">Alta</option>
            <option value="urgent">Urgente</option>
        </select>
    </div>
</div>

<div class="module-content">
    <div id="leadsList">
        <!-- Lista de leads será renderizada aqui -->
    </div>
</div>

<!-- Modal de Lead -->
<div id="leadModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="leadModalTitle">Novo Lead</h2>
            <button class="modal-close" onclick="leadsModule.hideLeadForm()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="leadForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="leadName">Nome *</label>
                        <input type="text" id="leadName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="leadCompany">Empresa</label>
                        <input type="text" id="leadCompany" name="company">
                    </div>
                    <div class="form-group">
                        <label for="leadEmail">Email</label>
                        <input type="email" id="leadEmail" name="email">
                    </div>
                    <div class="form-group">
                        <label for="leadPhone">Telefone</label>
                        <input type="tel" id="leadPhone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="leadSource">Origem *</label>
                        <select id="leadSource" name="source" required>
                            <option value="">Selecione a origem...</option>
                            <option value="website">Website</option>
                            <option value="social_media">Redes Sociais</option>
                            <option value="email_marketing">Email Marketing</option>
                            <option value="referral">Indicação</option>
                            <option value="cold_call">Cold Call</option>
                            <option value="event">Evento</option>
                            <option value="advertisement">Anúncio</option>
                            <option value="other">Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="leadStatus">Status</label>
                        <select id="leadStatus" name="status">
                            <option value="new">Novo</option>
                            <option value="contacted">Contatado</option>
                            <option value="qualified">Qualificado</option>
                            <option value="proposal">Proposta</option>
                            <option value="negotiation">Negociação</option>
                            <option value="converted">Convertido</option>
                            <option value="lost">Perdido</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="leadPriority">Prioridade</label>
                        <select id="leadPriority" name="priority">
                            <option value="low">Baixa</option>
                            <option value="medium">Média</option>
                            <option value="high">Alta</option>
                            <option value="urgent">Urgente</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="leadNotes">Observações</label>
                        <textarea id="leadNotes" name="notes" rows="4" placeholder="Informações adicionais sobre o lead, interesse demonstrado, etc."></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelLeadBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
